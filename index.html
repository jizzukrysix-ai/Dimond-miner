<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram File Downloader</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad-adsgram.js"></script>
  
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --accent-color: #66fcf1;
      --accent-hover: #45a29e;
      --text-color: #c5c6c7;
      --text-bright: #ffffff;
      --danger-color: #ff4d4d;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--text-bright);
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .adblock-banner {
      display: none;
      background-color: var(--danger-color);
      color: white;
      padding: 12px;
      border-radius: var(--border-radius);
      margin-bottom: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .folder-card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .folder-card:active {
      transform: scale(0.97);
    }

    .thumbnail-box {
      width: 100%;
      height: 120px;
      background-color: #151a21;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .thumbnail-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .folder-info {
      padding: 10px;
      text-align: center;
    }

    .folder-info h3 {
      color: var(--text-bright);
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(102, 252, 241, 0.2);
    }

    .modal-card h2 {
      color: var(--text-bright);
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .counter-badge {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 12px 0;
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.1);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar-fill {
      background: var(--accent-color);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>File Vault</h1>
    <p>Watch 6 required ads to unlock file download</p>
  </header>

  <div id="adblock-warning" class="adblock-banner">
    ⚠️ AdBlock Detected! Disable AdBlocker to watch ads and access files.
  </div>

  <div id="folder-grid" class="folder-grid"></div>

  <!-- Ad Modal -->
  <div id="unlock-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="modal-folder-title">Folder Name</h2>
      <p>Watch 6 Ads to unlock your direct file download link.</p>
      
      <div id="counter-text" class="counter-badge">0 / 6 ADS</div>
      
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>

      <button id="watch-ad-btn" class="btn" onclick="playAd()">Watch Ad (+1)</button>
      <button id="download-btn" class="btn" style="display: none;" onclick="triggerDownload()">Download File</button>
      <button class="btn btn-secondary" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    // Telegram WebApp Initialization
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Fixed 6 Adsgram Block IDs
    const adsgramBlocks = [
      "int-57670",
      "int-57671",
      "int-57672",
      "int-57673",
      "57674",
      "57618"
    ];

    // Add or edit your file folders here
    const folders = [
      { id: "1", name: "FREE PREMIUM SENSI", thumb: "https://i.ibb.co/xtDZ35mC/IMG-20261018-025848-380.jpg", url: "https://drive.google.com/drive/folders/1-gTsX9qisUIC1u3lT2Eum2XPrHUPeQzL" },
      { id: "2", name: "Sample Pack 2", thumb: "https://via.placeholder.com/150/1f2833/66fcf1?text=File+2", url: "https://example.com/file2.zip" }
    ];

    let currentFolder = null;
    let currentAdCount = 0;

    function renderFolders() {
      const grid = document.getElementById('folder-grid');
      grid.innerHTML = '';

      if (folders.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; opacity:0.6;">No files available.</p>';
        return;
      }

      folders.forEach(folder => {
        const card = document.createElement('div');
        card.className = 'folder-card';
        card.onclick = () => openModal(folder);
        card.innerHTML = `
          <div class="thumbnail-box">
            <img src="${folder.thumb}" alt="${folder.name}" onerror="this.src='https://via.placeholder.com/150/1f2833/66fcf1?text=No+Image'">
          </div>
          <div class="folder-info">
            <h3>${folder.name}</h3>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function checkAdBlocker() {
      const adblockBanner = document.getElementById('adblock-warning');
      if (typeof window.Adsgram === 'undefined') {
        adblockBanner.style.display = 'block';
        return true;
      } else {
        adblockBanner.style.display = 'none';
        return false;
      }
    }

    function openModal(folder) {
      if (checkAdBlocker()) {
        alert("Please disable your AdBlocker to proceed.");
        return;
      }
      currentFolder = folder;
      currentAdCount = 0;

      document.getElementById('modal-folder-title').innerText = folder.name;
      updateProgress();
      
      document.getElementById('watch-ad-btn').style.display = 'block';
      document.getElementById('download-btn').style.display = 'none';
      document.getElementById('unlock-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('unlock-modal').style.display = 'none';
      currentFolder = null;
    }

    function updateProgress() {
      const counterText = document.getElementById('counter-text');
      const progressFill = document.getElementById('progress-fill');
      
      counterText.innerText = `${currentAdCount} / 6 ADS`;
      const percentage = (currentAdCount / 6) * 100;
      progressFill.style.width = `${percentage}%`;
    }

    function playAd() {
      if (checkAdBlocker()) {
        alert("AdBlocker detected. Turn off AdBlocker to gain credit!");
        return;
      }

      const currentBlockId = adsgramBlocks[currentAdCount] || adsgramBlocks[0];

      if (window.Adsgram) {
        const AdController = window.Adsgram.init({ blockId: currentBlockId });
        
        AdController.show().then((result) => {
          currentAdCount++;
          updateProgress();

          if (currentAdCount >= 6) {
            document.getElementById('watch-ad-btn').style.display = 'none';
            document.getElementById('download-btn').style.display = 'block';
          }
        }).catch((result) => {
          alert("Ad failed or was closed early. Please watch the full ad to proceed.");
        });
      } else {
        alert("Adsgram SDK unavailable. Check network or AdBlock settings.");
      }
    }

    function triggerDownload() {
      if (currentFolder && currentFolder.url) {
        window.open(currentFolder.url, '_blank');
      }
    }

    window.onload = () => {
      checkAdBlocker();
      renderFolders();
    };
  </script>
</body>
</html>
